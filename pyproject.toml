[project]
name = "stocks"
version = "0.2.0"
description = "Stock evaluation multi-agent system — deterministic core, thin LLM layer"
authors = [{ name = "Lokeshwar Jakhar", email = "lokeshwarjakhar72@gmail.com" }]
requires-python = ">=3.11,<3.15"
dependencies = [
    "crewai[tools]>=1.15.18,<2.0.0",
    "litellm>=1.60",
    "pydantic>=2.7",
    "yfinance>=0.2.40",
    "pandas>=2.2",
    "numpy>=1.26",
    "httpx>=0.27",
    "edgartools>=3.0",
    "python-dotenv>=1.0",
    "jinja2>=3.1",
    "markdown>=3.6",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "respx>=0.21",
    "httpx>=0.27",
]

[project.scripts]
stocks = "stocks.main:main"
stocks-web = "stocks.web.app:main"
run_crew = "stocks.main:run"
kickoff = "stocks.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stocks"]
artifacts = ["src/stocks/web/templates/*.html"]

[tool.crewai]
type = "crew"
project_id = "a44a1d69-f234-4083-a628-44bf674e4be5"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
