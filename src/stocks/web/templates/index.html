<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stock Evaluation</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --ink: #1a1d21; --muted: #6b7280;
    --line: #e5e7eb; --accent: #2563eb; --accent-ink: #fff;
    --warn-bg: #fef2f2; --warn-line: #fecaca; --warn-ink: #991b1b;
    --ok: #16a34a; --bar-track: #e5e7eb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --card: #171a21; --ink: #e6e8eb; --muted: #9aa3af;
      --line: #262b34; --accent: #3b82f6;
      --warn-bg: #2a1416; --warn-line: #5b2326; --warn-ink: #fca5a5;
      --bar-track: #2a2f3a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 860px; margin: 0 auto; padding: 28px 18px 80px; }
  h1 { font-size: 20px; margin: 0 0 2px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 18px; margin-bottom: 16px;
  }
  form { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  input[type=text] {
    flex: 1 1 160px; min-width: 140px; padding: 10px 12px; font-size: 16px;
    border: 1px solid var(--line); border-radius: 8px; background: var(--bg);
    color: var(--ink); text-transform: uppercase;
  }
  button {
    padding: 10px 18px; font-size: 15px; font-weight: 600; cursor: pointer;
    border: 0; border-radius: 8px; background: var(--accent); color: var(--accent-ink);
  }
  button:disabled { opacity: .5; cursor: default; }
  .opts { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 12px;
    font-size: 13px; color: var(--muted); }
  .opts label { display: flex; gap: 6px; align-items: center; cursor: pointer; }
  .chips { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    font-size: 12px; padding: 4px 10px; border: 1px solid var(--line);
    border-radius: 999px; cursor: pointer; color: var(--muted); background: none;
  }
  .chip:hover { color: var(--ink); }
  #status { color: var(--muted); font-size: 14px; margin: 8px 2px; }
  .spinner {
    display: inline-block; width: 14px; height: 14px; border: 2px solid var(--line);
    border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite;
    vertical-align: -2px; margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .meta { color: var(--muted); font-size: 13px; margin-bottom: 12px; }
  .badge { display: inline-block; padding: 1px 7px; border-radius: 5px; font-size: 11px;
    background: var(--bar-track); color: var(--muted); margin-left: 6px; }
  .warn {
    background: var(--warn-bg); border: 1px solid var(--warn-line); color: var(--warn-ink);
    border-radius: 8px; padding: 10px 12px; font-size: 13px; margin-bottom: 14px;
  }
  .warn ul { margin: 6px 0 0; padding-left: 18px; }
  .scores { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 20px; margin: 4px 0 16px; }
  .score .lbl { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; }
  .track { height: 8px; background: var(--bar-track); border-radius: 999px; margin-top: 4px; overflow: hidden; }
  .fill { height: 100%; background: var(--accent); border-radius: 999px; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
  .tab {
    padding: 8px 14px; font-size: 13px; cursor: pointer; border: 0; background: none;
    color: var(--muted); border-bottom: 2px solid transparent; font-weight: 600;
  }
  .tab.active { color: var(--ink); border-bottom-color: var(--accent); }
  .report h1 { font-size: 18px; margin: 18px 0 6px; }
  .report h2 { font-size: 15px; margin: 20px 0 6px; }
  .report blockquote {
    margin: 0 0 12px; padding: 8px 12px; background: var(--bg);
    border-left: 3px solid var(--line); color: var(--muted); font-size: 13px;
  }
  .report table { border-collapse: collapse; width: 100%; font-size: 13px; display: block; overflow-x: auto; }
  .report th, .report td { border: 1px solid var(--line); padding: 5px 8px; text-align: left; }
  .report a { color: var(--accent); }
  .report code, pre { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
  pre { background: var(--bg); padding: 12px; border-radius: 8px; overflow-x: auto; }
  .hidden { display: none; }
  .err { color: var(--warn-ink); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Stock Evaluation</h1>
  <div class="sub">Facts about a company — fundamentals, price context, news, risks. Not financial advice; no price predictions.</div>

  <div class="card">
    <form id="f">
      <input type="text" id="ticker" placeholder="ticker, e.g. NVDA" autocomplete="off" autofocus>
      <button type="submit" id="go">Evaluate</button>
    </form>
    <div class="opts">
      <label><input type="checkbox" id="full" checked> Full analysis (AI news + narrative — slower)</label>
      <label><input type="checkbox" id="cached"> Show last saved run if there is one</label>
    </div>
    <div class="chips" id="chips"></div>
  </div>

  <div id="status"></div>

  <div class="card hidden" id="result">
    <div class="meta" id="meta"></div>
    <div id="qa"></div>
    <div id="changed"></div>
    <div class="scores" id="scores"></div>
    <div class="tabs">
      <button class="tab active" data-t="simple">Simple</button>
      <button class="tab" data-t="full">Full</button>
      <button class="tab" data-t="json">JSON</button>
    </div>
    <div class="report" id="pane"></div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
let DATA = null, TAB = 'simple', t0 = 0, timer = null;

async function loadHistory() {
  try {
    const r = await fetch('/api/history'); const j = await r.json();
    const box = $('#chips'); box.innerHTML = '';
    j.tickers.slice(0, 12).forEach(x => {
      const b = document.createElement('button');
      b.className = 'chip'; b.type = 'button';
      b.textContent = x.ticker;
      b.onclick = () => { $('#ticker').value = x.ticker; $('#f').requestSubmit(); };
      box.appendChild(b);
    });
  } catch (e) {}
}

function tick() {
  const s = Math.round((Date.now() - t0) / 1000);
  $('#status').innerHTML = `<span class="spinner"></span>Evaluating… ${s}s`
    + ($('#full').checked ? '  (AI mode can take a few minutes)' : '');
}

function bar(label, val, hint) {
  const v = val == null ? 0 : val;
  return `<div class="score">
    <div class="lbl"><span>${label}</span><span>${val == null ? '–' : Math.round(val)}</span></div>
    <div class="track"><div class="fill" style="width:${v}%"></div></div>
    <div class="lbl"><span>${hint}</span></div>
  </div>`;
}

function render() {
  if (!DATA) return;
  $('#result').classList.remove('hidden');
  $('#meta').innerHTML = `<strong>${DATA.company_name}</strong> (${DATA.ticker}) · as of ${DATA.generated_at} · run ${DATA.run_id}`
    + (DATA.from_cache ? '<span class="badge">saved run</span>' : '');

  $('#qa').innerHTML = DATA.qa_violations.length
    ? `<div class="warn"><strong>${DATA.qa_violations.length} automatic fact-check flag(s)</strong>
       <ul>${DATA.qa_violations.map(v => `<li>${v}</li>`).join('')}</ul></div>` : '';

  $('#changed').innerHTML = DATA.changed_since_last_run.length
    ? `<div class="warn" style="background:var(--bg);border-color:var(--line);color:var(--muted)">
       <strong>Since last run:</strong><ul>${DATA.changed_since_last_run.map(v => `<li>${v}</li>`).join('')}</ul></div>` : '';

  const s = DATA.scores;
  $('#scores').innerHTML =
      bar('Price vs. value', s.valuation, 'cheap for what it earns → higher')
    + bar('Growth', s.growth, 'sales growing faster → higher')
    + bar('Money health', s.financial_health, 'pays bills easily → higher')
    + bar('Recent price trend', s.momentum, 'price drifting up → higher');

  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.t === TAB));
  if (TAB === 'simple') $('#pane').innerHTML = DATA.simple_html;
  else if (TAB === 'full') $('#pane').innerHTML = DATA.full_html;
  else $('#pane').innerHTML = '<pre>' + JSON.stringify(DATA.json, null, 2)
    .replace(/</g, '&lt;') + '</pre>';
}

document.querySelectorAll('.tab').forEach(t =>
  t.onclick = () => { TAB = t.dataset.t; render(); });

$('#f').onsubmit = async (e) => {
  e.preventDefault();
  const ticker = $('#ticker').value.trim().toUpperCase();
  if (!ticker) return;
  $('#go').disabled = true;
  $('#result').classList.add('hidden');
  t0 = Date.now(); tick(); timer = setInterval(tick, 1000);
  try {
    const qs = new URLSearchParams({ ticker, full: $('#full').checked, cached_ok: $('#cached').checked });
    const r = await fetch('/api/report?' + qs);
    const j = await r.json();
    if (!r.ok) throw new Error(j.detail || r.statusText);
    DATA = j; TAB = 'simple'; render();
    $('#status').textContent = '';
    loadHistory();
  } catch (err) {
    $('#status').innerHTML = `<span class="err">Error: ${err.message}</span>`;
  } finally {
    clearInterval(timer); $('#go').disabled = false;
  }
};

loadHistory();
</script>
</body>
</html>
